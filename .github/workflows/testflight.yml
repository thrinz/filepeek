# Builds the iOS app on EAS and submits it to TestFlight whenever mobile/ changes on the mobile-app branch.
# Also runs hourly as a safety net: if the branch has moved past the last deployed commit (tag
# `testflight-latest`), it deploys; otherwise it exits without building.
name: TestFlight

on:
  push:
    branches: [mobile-app]
    paths:
      - "mobile/**"
      - ".github/workflows/testflight.yml"
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if the commit was already deployed"
        type: boolean
        default: false

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  APP_DIR: mobile
  DEPLOY_TAG: testflight-latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # Scheduled and manual runs always deploy the mobile-app branch (cron only fires on the default branch).
          ref: ${{ github.event_name == 'push' && github.sha || 'mobile-app' }}
          fetch-depth: 0

      - name: Decide whether to build
        id: gate
        run: |
          head=$(git rev-parse HEAD)
          deployed=$(git rev-parse -q --verify "refs/tags/$DEPLOY_TAG^{commit}" 2>/dev/null || echo none)
          echo "head=$head deployed=$deployed event=$GITHUB_EVENT_NAME force=${{ inputs.force }}"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "push" ] || [ "${{ inputs.force }}" = "true" ] || [ "$deployed" != "$head" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nothing new since $DEPLOY_TAG; skipping build."
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.build == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        if: steps.gate.outputs.build == 'true'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        if: steps.gate.outputs.build == 'true'
        working-directory: ${{ env.APP_DIR }}
        run: npm ci --no-audit --no-fund

      - name: Build on EAS and submit to TestFlight
        if: steps.gate.outputs.build == 'true'
        working-directory: ${{ env.APP_DIR }}
        env:
          EAS_BUILD_NO_EXPO_GO_WARNING: "true"
        run: eas build --platform ios --profile production --auto-submit --non-interactive --message "${{ steps.gate.outputs.head }}"

      - name: Record deployed commit
        if: steps.gate.outputs.build == 'true'
        run: |
          git tag -f "$DEPLOY_TAG" "${{ steps.gate.outputs.head }}"
          git push -f origin "refs/tags/$DEPLOY_TAG"
